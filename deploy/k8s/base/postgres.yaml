apiVersion: v1
kind: Service
metadata:
  name: soc-rapid-block-db
  namespace: sophos-blocker
  labels:
    app.kubernetes.io/name: soc-rapid-block-db
    app.kubernetes.io/part-of: soc-rapid-block
spec:
  clusterIP: None            # headless service cho StatefulSet
  selector:
    app.kubernetes.io/name: soc-rapid-block-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: soc-rapid-block-db
  namespace: sophos-blocker
  labels:
    app.kubernetes.io/name: soc-rapid-block-db
    app.kubernetes.io/part-of: soc-rapid-block
spec:
  serviceName: soc-rapid-block-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: soc-rapid-block-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soc-rapid-block-db
        app.kubernetes.io/part-of: soc-rapid-block
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: soc-rapid-block-config, key: POSTGRES_DB }
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: soc-rapid-block-config, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: soc-rapid-block-secrets, key: POSTGRES_PASSWORD }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: TZ
              valueFrom:
                configMapKeyRef: { name: soc-rapid-block-config, key: TZ }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sophos", "-d", "sophos_blocker"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "sophos"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        # Đặt đúng StorageClass của cụm. Cụm RKE2 hiện tại dùng Longhorn.
        # LƯU Ý: volumeClaimTemplates của StatefulSet KHÔNG sửa được sau khi tạo — giá trị này phải khớp
        # với PVC đang chạy, nếu không `kubectl apply` sẽ báo "spec: Forbidden". Đổi sang cụm khác thì sửa trước khi tạo lần đầu.
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
