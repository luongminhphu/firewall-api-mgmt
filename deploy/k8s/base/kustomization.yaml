apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infra-ops

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml           # ⚠️ Thay bằng Secret thật khi triển khai (xem hướng dẫn trong file)
  - postgres.yaml
  - app.yaml
  - network-policy.yaml

# Đổi tag image tại đây khi có release mới, ví dụ:
#   kustomize edit set image ghcr.io/luongminhphu/firewall-api-mgmt=ghcr.io/luongminhphu/firewall-api-mgmt:v1.0.1
images:
  - name: ghcr.io/luongminhphu/firewall-api-mgmt
    newTag: latest

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: soc-rapid-block
      app.kubernetes.io/managed-by: kustomize
