apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infra-ops

resources:
  - namespace.yaml
  - configmap.yaml
  # KHÔNG include secret.yaml — tạo Secret thật bằng `kubectl create secret generic ...`.
  # File secret.yaml giữ trong repo chỉ để tham chiếu cấu trúc; bật dòng dưới nếu bạn muốn quản lý Secret qua Sealed-Secrets / SOPS.
  # - secret.yaml
  - postgres.yaml
  - app.yaml
  - network-policy.yaml

# Đổi tag image tại đây khi có release mới, ví dụ:
#   kustomize edit set image ghcr.io/luongminhphu/firewall-api-mgmt=ghcr.io/luongminhphu/firewall-api-mgmt:v1.0.1
images:
  - name: ghcr.io/luongminhphu/firewall-api-mgmt
    newTag: latest

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: soc-rapid-block
      app.kubernetes.io/managed-by: kustomize
