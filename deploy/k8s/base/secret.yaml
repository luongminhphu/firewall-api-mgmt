# ⚠️ File này CHỈ LÀ MẪU — sinh khóa thật rồi tạo Secret bằng:
#
#   kubectl -n infra-ops create secret generic soc-rapid-block-secrets \
#     --from-literal=MASTER_KEY=$(openssl rand -hex 32) \
#     --from-literal=SESSION_SECRET=$(openssl rand -hex 32) \
#     --from-literal=APP_PASSWORD='DoiMatKhauNay@2026' \
#     --from-literal=POSTGRES_PASSWORD=$(openssl rand -hex 24) \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Không commit Secret có giá trị thật lên Git.
apiVersion: v1
kind: Secret
metadata:
  name: soc-rapid-block-secrets
  namespace: infra-ops
type: Opaque
stringData:
  MASTER_KEY: "REPLACE_openssl_rand_hex_32"
  SESSION_SECRET: "REPLACE_openssl_rand_hex_32"
  APP_PASSWORD: "REPLACE_APP_PASSWORD"
  POSTGRES_PASSWORD: "REPLACE_DB_PASSWORD"
