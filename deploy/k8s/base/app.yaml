apiVersion: apps/v1
kind: Deployment
metadata:
  name: soc-rapid-block-app
  namespace: soc-rapid-block
  labels:
    app.kubernetes.io/name: soc-rapid-block-app
    app.kubernetes.io/part-of: soc-rapid-block
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: soc-rapid-block-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soc-rapid-block-app
        app.kubernetes.io/part-of: soc-rapid-block
        app.kubernetes.io/component: web
    spec:
      # Nếu image ở GHCR private, dùng imagePullSecret:
      #   kubectl -n soc-rapid-block create secret docker-registry ghcr-pull \
      #     --docker-server=ghcr.io --docker-username=<gh-user> \
      #     --docker-password=<PAT read:packages> --docker-email=<email>
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: app
          image: ghcr.io/luongminhphu/firewall-api-mgmt:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: { name: soc-rapid-block-config }
            - secretRef:    { name: soc-rapid-block-secrets }
          env:
            # Ghi đè DATABASE_URL với password đã resolve từ Secret
            - name: DATABASE_URL
              value: "postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@soc-rapid-block-db:5432/$(POSTGRES_DB)"
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: "100m", memory: "192Mi" }
            limits:   { cpu: "1",    memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: soc-rapid-block
  namespace: soc-rapid-block
  labels:
    app.kubernetes.io/name: soc-rapid-block-app
    app.kubernetes.io/part-of: soc-rapid-block
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: soc-rapid-block-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      # Cổng phải nằm trong dải NodePort của cluster (mặc định 30000–32767)
      nodePort: 30880
